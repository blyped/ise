name: E2E — routage public et back-office Superadmin (ADDENDUM §55 + SA-0XX)

# ---------------------------------------------------------------------------
# AVERTISSEMENT
#
# Ces scenarios n'ont JAMAIS ete executes. L'environnement de developpement
# dans lequel ils ont ete ecrits bloque `*.supabase.co` : aucune connexion
# reelle n'y est possible. Ce workflow est le premier endroit ou ils
# tourneront — aussi bien les trois scenarios historiques du §55 que la
# couverture /administration/** ajoutee ensuite (admin-*.spec.ts).
#
# Il est volontairement SEPARE de `ci.yml` : tant qu'il n'est pas passe au
# vert, il ne doit pas bloquer la chaine principale. Il est declenche a la
# main (`workflow_dispatch`) et une fois par nuit.
#
# Secrets a configurer avant la premiere execution :
#   E2E_SUPABASE_URL, E2E_SUPABASE_ANON_KEY : projet de test.
#   E2E_MEMBER_EMAIL, E2E_MEMBER_PASSWORD   : compte de test reel, prefixe
#                                             `test+` et marque
#                                             `is_test_account` (D-104).
#   E2E_SUPERADMIN_EMAIL, E2E_SUPERADMIN_PASSWORD : compte de test reel
#                                             AVEC un role d'administration
#                                             attribue. N'EXISTE PAS ENCORE
#                                             au moment ou ce commentaire est
#                                             ecrit — voir admin-helpers.ts
#                                             pour le detail : ce workflow ne
#                                             le provisionne pas, c'est une
#                                             etape manuelle prealable.
# Sans ces secrets, les scenarios qui exigent une session se declarent
# `skipped` plutot que de passer faussement au vert.
#
# Variable (PAS un secret, ecriture explicitement desactivee par defaut) :
#   E2E_ADMIN_ALLOW_WRITES=true : autorise les scenarios qui ECRIVENT en
#                                 base (admin-communities.spec.ts). La base
#                                 cible est la PRODUCTION (C-01) : a activer
#                                 en connaissance de cause seulement.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  redirect:
    name: Scenarios de redirection
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_ENVIRONMENT: local
      E2E_BASE_URL: http://localhost:3000
      E2E_MEMBER_EMAIL: ${{ secrets.E2E_MEMBER_EMAIL }}
      E2E_MEMBER_PASSWORD: ${{ secrets.E2E_MEMBER_PASSWORD }}
      E2E_PROTECTED_TARGET: /tableau-de-bord
      E2E_SUPERADMIN_EMAIL: ${{ secrets.E2E_SUPERADMIN_EMAIL }}
      E2E_SUPERADMIN_PASSWORD: ${{ secrets.E2E_SUPERADMIN_PASSWORD }}
      E2E_ADMIN_ALLOW_WRITES: ${{ vars.E2E_ADMIN_ALLOW_WRITES }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Installer les navigateurs Playwright
        # webkit en plus de chromium : le projet `mobile-375` emule un
        # iPhone SE (playwright.config.ts), dont le navigateur par defaut
        # est WebKit — sans lui, TOUS les scenarios mobiles echouent au
        # lancement du navigateur (constat du run #8).
        run: pnpm --filter @ise/web exec playwright install --with-deps chromium webkit

      - name: Build de production
        run: pnpm --filter @ise/web build

      - name: Scenarios §55
        run: pnpm --filter @ise/web exec playwright test

      - name: Rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
          if-no-files-found: ignore
